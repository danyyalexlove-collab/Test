<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test FarmaCobro</title>
<style>
body{font-family:sans-serif;padding:20px;background:#f0f0f0;}
button{background:#1a4d2e;color:white;border:none;padding:15px 20px;border-radius:10px;font-size:1rem;width:100%;margin-bottom:10px;cursor:pointer;}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;font-size:1rem;margin-bottom:10px;box-sizing:border-box;}
#resultado{background:white;padding:15px;border-radius:10px;margin-top:10px;display:none;}
</style>
</head>
<body>
<h2>🧪 Prueba FarmaCobro</h2>
<p>Escribe un nombre y toca el botón:</p>
<input type="text" id="nombre" placeholder="Nombre del cobrador">
<input type="tel" id="pin" placeholder="PIN (4 dígitos)" maxlength="4">
<button onclick="guardar()">Agregar Cobrador</button>
<div id="resultado"></div>

<script>
function guardar(){
  var n = document.getElementById('nombre').value;
  var p = document.getElementById('pin').value;
  var res = document.getElementById('resultado');
  
  if(!n){
    res.style.display='block';
    res.innerHTML='<p style="color:red">⚠️ Escribe el nombre</p>';
    return;
  }
  
  res.style.display='block';
  res.innerHTML='<p style="color:green">✅ Funcionó!<br>Nombre: '+n+'<br>PIN: '+p+'</p>';
  
  // Guardar en localStorage
  try{
    localStorage.setItem('test_cobrador', JSON.stringify({nombre:n, pin:p}));
    res.innerHTML += '<p>💾 Guardado en memoria ✅</p>';
  }catch(e){
    res.innerHTML += '<p style="color:red">❌ Error localStorage: '+e+'</p>';
  }
}

// Cargar si hay datos guardados
try{
  var guardado = localStorage.getItem('test_cobrador');
  if(guardado){
    var d = JSON.parse(guardado);
    document.getElementById('resultado').style.display='block';
    document.getElementById('resultado').innerHTML='<p>📱 Datos anteriores: '+d.nombre+' / '+d.pin+'</p>';
  }
}catch(e){}
</script>
</body>
</html>
